<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jimpitan RW 01 - Cloud Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 flex justify-center items-center min-h-screen p-0 m-0 font-sans">

    <!-- Container Utama ukuran HP (Mobile Frame) -->
    <div id="root" class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl relative flex flex-col justify-between overflow-x-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // =========================================================================
        // URL WEB APP GOOGLE APPS SCRIPT ANDA
        // =========================================================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwSbdrQVbzbl-G-6rh5gkJvcQkbEX3f6RahIOXboFvFfKne-tmK5Gy1OHGqlJn1Oazf/exec';

        function App() {
          const [isLoading, setIsLoading] = useState(true);
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [userRole, setUserRole] = useState('PETUGAS');
          const [userName, setUserName] = useState('');
          const [loginInputUser, setLoginInputUser] = useState('');
          const [loginInputPass, setLoginInputPass] = useState('');
          const [loginError, setLoginError] = useState('');

          const [activeTab, setActiveTab] = useState('beranda');
          
          const [wargaList, setWargaList] = useState([]);
          const [transactions, setTransactions] = useState([]);
          const [auditLogs, setAuditLogs] = useState([]);

          const [kewajibanHarian] = useState(500);
          const [jumlahHariBulanIni] = useState(30);
          const [saldoKasAwal, setSaldoKasAwal] = useState(0); 
          const [toastMessage, setToastMessage] = useState(null);
          const [isSyncing, setIsSyncing] = useState(false);

          // Modal States
          const [showInputModal, setShowInputModal] = useState(false);
          const [showAddWargaModal, setShowAddWargaModal] = useState(false);
          
          // Edit States
          const [showEditWargaModal, setShowEditWargaModal] = useState(false);
          const [editWargaId, setEditWargaId] = useState(null);
          const [editNama, setEditNama] = useState('');
          const [editSaldoAwal, setEditSaldoAwal] = useState(0);

          const [showEditTransModal, setShowEditTransModal] = useState(false);
          const [editTransId, setEditTransId] = useState(null);
          const [editTransWargaId, setEditTransWargaId] = useState('');
          const [editTransNominal, setEditTransNominal] = useState(500);
          const [editTransTanggal, setEditTransTanggal] = useState('');
          
          // Form States
          const todayStr = new Date().toISOString().split('T')[0];
          const currentMonthStr = todayStr.substring(0, 7);

          const [selectedWargaId, setSelectedWargaId] = useState('');
          const [inputNominal, setInputNominal] = useState(500);
          const [inputTanggal, setInputTanggal] = useState(todayStr);

          // New Warga Form
          const [newNama, setNewNama] = useState('');
          const [newSaldoAwal, setNewSaldoAwal] = useState(0);

          const [currentActiveMonth] = useState(currentMonthStr);

          // AMBIL DATA DARI GOOGLE SHEETS
          const fetchCloudData = async () => {
            if (GOOGLE_SCRIPT_URL.includes('MASUKKAN_URL')) {
              setIsLoading(false);
              return;
            }
            try {
              setIsSyncing(true);
              const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getData`);
              const data = await response.json();
              if (data.warga) setWargaList(data.warga);
              if (data.transaksi) setTransactions(data.transaksi);
              if (data.log_audit) setAuditLogs(data.log_audit);
              if (data.saldo_kas !== undefined) setSaldoKasAwal(data.saldo_kas);
            } catch (err) {
              console.log("Gagal mengambil data cloud:", err);
              showToast("⚠️ Gagal menyinkronkan data cloud");
            } finally {
              setIsSyncing(false);
              setIsLoading(false);
            }
          };

          useEffect(() => {
            fetchCloudData();
          }, []);

          const playNotificationAndTTS = (textToSpeak) => {
            try {
              const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
              audio.volume = 0.8;
              audio.play().catch(e => console.log("Audio play blocked:", e));

              if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(textToSpeak);
                speech.lang = 'id-ID';
                speech.rate = 1.0;
                speech.pitch = 1.1; 

                const voices = window.speechSynthesis.getVoices();
                const idVoice = voices.find(v => v.lang === 'id-ID' && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('indonesia') || v.name.toLowerCase().includes('google')));
                if (idVoice) speech.voice = idVoice;

                setTimeout(() => { window.speechSynthesis.speak(speech); }, 400);
              }
            } catch (err) {
              console.log("TTS error:", err);
            }
          };

          const showToast = (msg) => {
            setToastMessage(msg);
            setTimeout(() => setToastMessage(null), 3000);
          };

          const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
          };

          const getJimpitanBulanIni = (wargaId) => {
            return transactions
              .filter(t => Number(t.warga_id) === Number(wargaId))
              .reduce((sum, t) => sum + Number(t.nominal), 0);
          };

          const getSaldoAkhir = (wargaId) => {
            const warga = wargaList.find(w => Number(w.id) === Number(wargaId));
            if (!warga) return 0;
            const totalJimpitanAll = transactions.filter(t => Number(t.warga_id) === Number(wargaId)).reduce((sum, t) => sum + Number(t.nominal), 0);
            return Number(warga.saldo_awal) + totalJimpitanAll - (kewajibanHarian * jumlahHariBulanIni);
          };

          const getTop5Warga = () => {
            const scored = wargaList.map(w => ({ ...w, saldo_akhir: getSaldoAkhir(w.id) }));
            return scored.sort((a, b) => b.saldo_akhir - a.saldo_akhir).slice(0, 5);
          };

          const totalJimpitanBulanBerjalan = transactions
            .reduce((sum, t) => sum + Number(t.nominal), 0);

          const generateLaporanTeks = () => {
            let text = `📋 *REKAPITULASI JIMPITAN RW 01*\n🏡 Dukuh Polodadi, Desa Tarubasan\n📅 Periode: ${currentActiveMonth}\n\n`;
            wargaList.forEach((w, idx) => {
              text += `${idx + 1}. *${w.nama}* | Awal: ${formatRupiah(w.saldo_awal)} | Masuk: ${formatRupiah(getJimpitanBulanIni(w.id))} | Akhir: ${formatRupiah(getSaldoAkhir(w.id))}\n`;
            });
            text += `\n💰 *Total Jimpitan Bulan Ini: ${formatRupiah(totalJimpitanBulanBerjalan)}*\n_Laporan otomatis Cloud Jimpitan RW 01_`;
            return text;
          };

          // --- FUNGSI HAPUS & EDIT KE CLOUD ---
          const handleDeleteWarga = async (id, nama) => {
            if (!confirm(`Hapus data warga "${nama}"?`)) return;
            setIsSyncing(true);
            try {
              await fetch(`${GOOGLE_SCRIPT_URL}?action=hapusWarga&id=${id}&petugas=${encodeURIComponent(userName)}`);
              showToast("✓ Warga berhasil dihapus");
              fetchCloudData();
            } catch (e) {
              alert("Gagal menghapus warga");
            } finally {
              setIsSyncing(false);
            }
          };

          const handleDeleteTrans = async (id) => {
            if (!confirm("Hapus data transaksi ini?")) return;
            setIsSyncing(true);
            try {
              await fetch(`${GOOGLE_SCRIPT_URL}?action=hapusTransaksi&id=${id}&petugas=${encodeURIComponent(userName)}`);
              showToast("✓ Transaksi berhasil dihapus");
              fetchCloudData();
            } catch (e) {
              alert("Gagal menghapus transaksi");
            } finally {
              setIsSyncing(false);
            }
          };

          const handleLogin = (e) => {
            e.preventDefault();
            setLoginError('');
            const uTrim = loginInputUser.trim();
            const pTrim = loginInputPass.trim();

            if (uTrim.toLowerCase() === 'admin') {
              if (pTrim === 'admin') {
                setUserRole('ADMIN'); setUserName('Admin RW'); setIsLoggedIn(true); showToast("✓ Login Admin Berhasil");
              } else { setLoginError('Password Admin salah!'); }
            } else {
              if (!uTrim) { setLoginError('Username petugas harus diisi!'); return; }
              if (pTrim === '123456') {
                setUserRole('PETUGAS'); setUserName(uTrim.toUpperCase()); setIsLoggedIn(true); showToast(`✓ Login Petugas Berhasil`);
              } else { setLoginError('Password Petugas salah! Gunakan: 123456'); }
            }
          };

          if (isLoading) {
            return (
              <div className="flex flex-col items-center justify-center min-h-screen bg-emerald-800 text-white p-6 w-full max-w-md mx-auto">
                <div className="w-20 h-20 bg-white/10 backdrop-blur-md rounded-3xl flex items-center justify-center shadow-2xl mb-4 animate-pulse border border-white/20 text-4xl">🏡</div>
                <h1 className="text-lg font-bold tracking-wider">JIMPITAN RW 01</h1>
                <p className="text-emerald-200 text-xs mt-1">Menghubungkan ke Cloud Spreadsheet...</p>
              </div>
            );
          }

          if (!isLoggedIn) {
            return (
              <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 p-6 w-full max-w-md mx-auto">
                <div className="w-full bg-white rounded-3xl shadow-2xl p-6 border border-slate-100">
                  <div className="flex flex-col items-center mb-6">
                    <div className="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-emerald-600/30 mb-3">🏡</div>
                    <h1 className="text-base font-bold text-slate-800 tracking-wide">JIMPITAN RW 01 (CLOUD)</h1>
                    <p className="text-[11px] text-slate-400 text-center mt-0.5">Dukuh Polodadi, Tarubasan, Klaten</p>
                  </div>
                  {loginError && <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-semibold rounded-2xl text-center">{loginError}</div>}
                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-[10px] font-bold tracking-wider text-slate-500 mb-1.5 uppercase">Username</label>
                      <input type="text" placeholder="Nama petugas / admin" value={loginInputUser} onChange={(e) => setLoginInputUser(e.target.value)} className="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium" required />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold tracking-wider text-slate-500 mb-1.5 uppercase">Password</label>
                      <input type="password" placeholder="Masukkan password" value={loginInputPass} onChange={(e) => setLoginInputPass(e.target.value)} className="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium" required />
                    </div>
                    <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 text-xs tracking-wider uppercase">Masuk Aplikasi</button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen flex flex-col justify-between text-slate-800 bg-slate-100 relative pb-20">
              {toastMessage && (
                <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-2.5 border border-white/10 animate-bounce">
                  <span>🔔</span> {toastMessage}
                </div>
              )}

              <header className="bg-emerald-700 text-white p-5 rounded-b-[2rem] shadow-lg">
                <div className="flex justify-between items-center mb-3">
                  <div>
                    <h1 className="text-sm font-black tracking-wider">JIMPITAN RW 01</h1>
                    <p className="text-[10px] text-emerald-100 font-medium">☁️ Terhubung ke Cloud Spreadsheet</p>
                  </div>
                  <button onClick={() => setIsLoggedIn(false)} className="px-3 py-1.5 bg-emerald-800/80 hover:bg-emerald-900 rounded-xl text-emerald-100 text-[11px] font-bold">Keluar</button>
                </div>
                <div className="flex items-center justify-between mt-4 pt-3 border-t border-emerald-600/60 text-xs">
                  <span className="text-emerald-100 font-medium">👤 {userName} ({userRole})</span>
                  <button onClick={fetchCloudData} className="bg-emerald-800/80 hover:bg-emerald-900 px-3 py-1 rounded-full text-[10px] font-bold text-emerald-100 flex items-center gap-1">
                    {isSyncing ? '🔄 Menyinkronkan...' : '🔄 Sinkronkan Data'}
                  </button>
                </div>
              </header>

              <main className="p-4 space-y-4 flex-1">
                {activeTab === 'beranda' && (
                  <>
                    <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 flex justify-between items-center">
                      <div>
                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Saldo Kas Awal Bulan</p>
                        <h2 className="text-base font-black text-slate-800 mt-0.5">{formatRupiah(saldoKasAwal)}</h2>
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-emerald-600 to-teal-700 p-4 rounded-3xl shadow-md text-white flex justify-between items-center">
                      <div>
                        <p className="text-[10px] text-emerald-100 font-bold uppercase tracking-wider">Total Jimpitan Bulan Ini</p>
                        <h2 className="text-xl font-black mt-0.5">{formatRupiah(totalJimpitanBulanBerjalan)}</h2>
                        <p className="text-[9px] text-emerald-200 mt-1">Tersinkron otomatis di Cloud</p>
                      </div>
                      <div className="w-12 h-12 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center text-2xl border border-white/20">📈</div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <button onClick={() => setShowInputModal(true)} className="p-4 bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition-all text-white rounded-3xl shadow-lg shadow-emerald-600/25 flex flex-col items-center justify-center gap-1.5 font-bold text-xs">
                        <span className="text-2xl">💰</span> INPUT JIMPITAN
                      </button>
                      <button onClick={() => setShowAddWargaModal(true)} className="p-4 bg-white hover:bg-slate-50 active:scale-95 transition-all text-emerald-700 border border-emerald-200 rounded-3xl shadow-sm flex flex-col items-center justify-center gap-1.5 font-bold text-xs">
                        <span className="text-2xl">➕</span> TAMBAH WARGA
                      </button>
                    </div>

                    <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 space-y-3">
                      <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wider">🏆 Top 5 Saldo Warga</h3>
                      <div className="space-y-2">
                        {getTop5Warga().map((w, idx) => (
                          <div key={w.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-2xl text-xs border border-slate-100">
                            <span className="font-semibold text-slate-700">{idx+1}. {w.nama}</span>
                            <span className="font-black text-emerald-600">{formatRupiah(w.saldo_akhir)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}

                {activeTab === 'rekap' && (
                  <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 space-y-4">
                    <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wider">📊 Rekapitulasi & Kelola Warga</h3>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={() => {
                        const encoded = encodeURIComponent(generateLaporanTeks());
                        window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
                      }} className="py-2.5 bg-emerald-600 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5">💬 Kirim via WA</button>
                      <button onClick={() => {
                        const subject = encodeURIComponent("Rekap Jimpitan RW 01");
                        const body = encodeURIComponent(generateLaporanTeks());
                        window.open(`mailto:?subject=${subject}&body=${body}`, '_blank');
                      }} className="py-2.5 bg-sky-600 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5">✉️ Kirim ke Email</button>
                    </div>
                    <div className="space-y-2.5 max-h-[400px] overflow-y-auto no-scrollbar">
                      {wargaList.map((w, index) => (
                        <div key={w.id} className="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-xs space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-800">{index + 1}. {w.nama}</span>
                            <span className="font-black text-emerald-600">Akhir: {formatRupiah(getSaldoAkhir(w.id))}</span>
                          </div>
                          <div className="flex justify-between items-center pt-1 border-t border-slate-200/60 text-[11px]">
                            <span className="text-slate-500">Awal: {formatRupiah(w.saldo_awal)} | Masuk: {formatRupiah(getJimpitanBulanIni(w.id))}</span>
                            <div className="flex gap-1.5">
                              <button onClick={() => {
                                setEditWargaId(w.id);
                                setEditNama(w.nama);
                                setEditSaldoAwal(w.saldo_awal);
                                setShowEditWargaModal(true);
                              }} className="px-2.5 py-1 bg-amber-500 text-white rounded-xl font-bold">Edit</button>
                              <button onClick={() => handleDeleteWarga(w.id, w.nama)} className="px-2.5 py-1 bg-red-500 text-white rounded-xl font-bold">Hapus</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'riwayat' && (
                  <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 space-y-3">
                    <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wider">📋 Riwayat & Kelola Transaksi Cloud</h3>
                    <div className="space-y-2.5 max-h-[460px] overflow-y-auto no-scrollbar">
                      {transactions.slice().reverse().map(t => {
                        const warga = wargaList.find(w => Number(w.id) === Number(t.warga_id));
                        return (
                          <div key={t.id} className="p-3 bg-slate-50 rounded-2xl border border-slate-100 flex flex-col gap-1.5 text-xs">
                            <div className="flex justify-between items-center">
                              <div>
                                <p className="font-bold text-slate-800">{warga ? warga.nama : 'Warga'}</p>
                                <p className="text-[10px] text-slate-400 mt-0.5">📅 {t.tanggal} • Petugas: {t.petugas}</p>
                              </div>
                              <span className="font-black text-emerald-600">{formatRupiah(t.nominal)}</span>
                            </div>
                            <div className="flex justify-end gap-1.5 pt-1 border-t border-slate-200/60">
                              <button onClick={() => {
                                setEditTransId(t.id);
                                setEditTransWargaId(t.warga_id);
                                setEditTransNominal(t.nominal);
                                setEditTransTanggal(t.tanggal.split('T')[0]);
                                setShowEditTransModal(true);
                              }} className="px-2.5 py-1 bg-amber-500 text-white rounded-xl text-[10px] font-bold">Edit</button>
                              <button onClick={() => handleDeleteTrans(t.id)} className="px-2.5 py-1 bg-red-500 text-white rounded-xl text-[10px] font-bold">Hapus</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* TAB KHUSUS LOG AUDIT (Hanya Tampil Jika ADMIN) */}
                {activeTab === 'audit' && userRole === 'ADMIN' && (
                  <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 space-y-3">
                    <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wider">🛡️ Log Aktivitas / Audit Sistem</h3>
                    <div className="space-y-2 max-h-[460px] overflow-y-auto no-scrollbar">
                      {auditLogs.slice().reverse().map((log, idx) => (
                        <div key={idx} className="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-[11px] space-y-1">
                          <div className="flex justify-between font-bold text-slate-700">
                            <span className="text-emerald-700">⚡ {log.aksi}</span>
                            <span className="text-slate-400 font-normal">{log.waktu}</span>
                          </div>
                          <p className="text-slate-600">{log.detail}</p>
                          <p className="text-[10px] text-slate-400">Oleh: <span className="font-semibold text-slate-500">{log.petugas}</span></p>
                        </div>
                      ))}
                      {auditLogs.length === 0 && (
                        <p className="text-center text-xs text-slate-400 py-6">Belum ada data log aktivitas.</p>
                      )}
                    </div>
                  </div>
                )}
              </main>

              {/* MODAL INPUT JIMPITAN */}
              {showInputModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                  <div className="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-3xl p-6 space-y-4 shadow-2xl">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                      <h3 className="font-bold text-xs text-slate-800 uppercase tracking-wider">💰 Input Jimpitan</h3>
                      <button onClick={() => setShowInputModal(false)} className="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-xs">✕</button>
                    </div>
                    <div className="space-y-3.5">
                      <select value={selectedWargaId} onChange={(e) => setSelectedWargaId(e.target.value)} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-medium">
                        <option value="">-- Pilih Nama Warga --</option>
                        {wargaList.map(w => <option key={w.id} value={w.id}>{w.nama}</option>)}
                      </select>
                      <input type="date" value={inputTanggal} onChange={(e) => setInputTanggal(e.target.value)} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-medium" />
                      <input type="number" value={inputNominal} onChange={(e) => setInputNominal(Number(e.target.value))} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-bold" />
                      <button onClick={async () => {
                        if(!selectedWargaId) { alert("Pilih warga!"); return; }
                        setIsSyncing(true);
                        try {
                          await fetch(`${GOOGLE_SCRIPT_URL}?action=simpanTransaksi&warga_id=${selectedWargaId}&tanggal=${inputTanggal}&nominal=${inputNominal}&petugas=${encodeURIComponent(userName)}`);
                          showToast("✓ Berhasil Disimpan ke Cloud!");
                          setShowInputModal(false);
                          fetchCloudData();
                          playNotificationAndTTS("Jimpitan berhasil disimpan ke cloud");
                        } catch(e) {
                          alert("Gagal menyimpan ke cloud");
                        } finally {
                          setIsSyncing(false);
                        }
                      }} className="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-2xl text-xs uppercase tracking-wider">Simpan ke Cloud</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL TAMBAH WARGA */}
              {showAddWargaModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                  <div className="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-3xl p-6 space-y-4 shadow-2xl">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                      <h3 className="font-bold text-xs text-slate-800 uppercase tracking-wider">➕ Tambah Warga Baru</h3>
                      <button onClick={() => setShowAddWargaModal(false)} className="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-xs">✕</button>
                    </div>
                    <div className="space-y-3.5">
                      <input type="text" placeholder="Nama Warga" value={newNama} onChange={(e) => setNewNama(e.target.value)} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-medium uppercase" />
                      <input type="number" placeholder="Saldo Awal" value={newSaldoAwal} onChange={(e) => setNewSaldoAwal(Number(e.target.value))} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-bold" />
                      <button onClick={async () => {
                        if(!newNama.trim()) { alert("Nama kosong!"); return; }
                        const kodeWarga = `JMP-RW01-${Math.floor(Math.random()*9000 + 1000)}`;
                        setIsSyncing(true);
                        try {
                          await fetch(`${GOOGLE_SCRIPT_URL}?action=tambahWarga&kode_warga=${kodeWarga}&nama=${encodeURIComponent(newNama.toUpperCase())}&saldo_awal=${newSaldoAwal}&petugas=${encodeURIComponent(userName)}`);
                          showToast("✓ Warga Disimpan ke Cloud!");
                          setShowAddWargaModal(false);
                          setNewNama('');
                          setNewSaldoAwal(0);
                          fetchCloudData();
                        } catch(e) {
                          alert("Gagal tambah warga");
                        } finally {
                          setIsSyncing(false);
                        }
                      }} className="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-2xl text-xs uppercase tracking-wider">Simpan Warga</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL EDIT WARGA */}
              {showEditWargaModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                  <div className="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-3xl p-6 space-y-4 shadow-2xl">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                      <h3 className="font-bold text-xs text-slate-800 uppercase tracking-wider">✏️ Edit Data Warga</h3>
                      <button onClick={() => setShowEditWargaModal(false)} className="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-xs">✕</button>
                    </div>
                    <div className="space-y-3.5">
                      <input type="text" value={editNama} onChange={(e) => setEditNama(e.target.value)} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-medium uppercase" />
                      <input type="number" value={editSaldoAwal} onChange={(e) => setEditSaldoAwal(Number(e.target.value))} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-bold" />
                      <button onClick={async () => {
                        setIsSyncing(true);
                        try {
                          await fetch(`${GOOGLE_SCRIPT_URL}?action=editWarga&id=${editWargaId}&nama=${encodeURIComponent(editNama.toUpperCase())}&saldo_awal=${editSaldoAwal}&petugas=${encodeURIComponent(userName)}`);
                          showToast("✓ Warga berhasil diperbarui!");
                          setShowEditWargaModal(false);
                          fetchCloudData();
                        } catch(e) {
                          alert("Gagal memperbarui warga");
                        } finally {
                          setIsSyncing(false);
                        }
                      }} className="w-full py-3.5 bg-amber-500 text-white font-bold rounded-2xl text-xs uppercase tracking-wider">Perbarui Warga</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL EDIT TRANSAKSI */}
              {showEditTransModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                  <div className="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-3xl p-6 space-y-4 shadow-2xl">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                      <h3 className="font-bold text-xs text-slate-800 uppercase tracking-wider">✏️ Edit Transaksi Jimpitan</h3>
                      <button onClick={() => setShowEditTransModal(false)} className="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-xs">✕</button>
                    </div>
                    <div className="space-y-3.5">
                      <select value={editTransWargaId} onChange={(e) => setEditTransWargaId(e.target.value)} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-medium">
                        {wargaList.map(w => <option key={w.id} value={w.id}>{w.nama}</option>)}
                      </select>
                      <input type="date" value={editTransTanggal} onChange={(e) => setEditTransTanggal(e.target.value)} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-medium" />
                      <input type="number" value={editTransNominal} onChange={(e) => setEditTransNominal(Number(e.target.value))} className="w-full px-3.5 py-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-bold" />
                      <button onClick={async () => {
                        setIsSyncing(true);
                        try {
                          await fetch(`${GOOGLE_SCRIPT_URL}?action=editTransaksi&id=${editTransId}&warga_id=${editTransWargaId}&tanggal=${editTransTanggal}&nominal=${editTransNominal}&petugas=${encodeURIComponent(userName)}`);
                          showToast("✓ Transaksi berhasil diperbarui!");
                          setShowEditTransModal(false);
                          fetchCloudData();
                        } catch(e) {
                          alert("Gagal memperbarui transaksi");
                        } finally {
                          setIsSyncing(false);
                        }
                      }} className="w-full py-3.5 bg-amber-500 text-white font-bold rounded-2xl text-xs uppercase tracking-wider">Perbarui Transaksi</button>
                    </div>
                  </div>
                </div>
              )}

              {/* NAVIGASI BAWAH DINAMIS BERDASARKAN ROLE */}
              <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200/80 py-2.5 px-4 flex justify-around items-center rounded-t-[2rem] shadow-2xl z-40">
                <button onClick={() => setActiveTab('beranda')} className={`flex flex-col items-center gap-1 ${activeTab === 'beranda' ? 'text-emerald-600' : 'text-slate-400'}`}>
                  <span className="text-xl">🏠</span><span className="text-[10px] font-bold">Beranda</span>
                </button>
                <button onClick={() => setActiveTab('rekap')} className={`flex flex-col items-center gap-1 ${activeTab === 'rekap' ? 'text-emerald-600' : 'text-slate-400'}`}>
                  <span className="text-xl">📊</span><span className="text-[10px] font-bold">Rekap</span>
                </button>
                <button onClick={() => setShowInputModal(true)} className="flex flex-col items-center gap-0.5 text-white -mt-7 bg-emerald-600 p-3.5 rounded-full shadow-lg border-4 border-slate-50">
                  <span className="text-xl">💰</span>
                </button>
                <button onClick={() => setActiveTab('riwayat')} className={`flex flex-col items-center gap-1 ${activeTab === 'riwayat' ? 'text-emerald-600' : 'text-slate-400'}`}>
                  <span className="text-xl">📋</span><span className="text-[10px] font-bold">Riwayat</span>
                </button>
                {userRole === 'ADMIN' && (
                  <button onClick={() => setActiveTab('audit')} className={`flex flex-col items-center gap-1 ${activeTab === 'audit' ? 'text-emerald-600' : 'text-slate-400'}`}>
                    <span className="text-xl">🛡️</span><span className="text-[10px] font-bold">Log Audit</span>
                  </button>
                )}
              </nav>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
